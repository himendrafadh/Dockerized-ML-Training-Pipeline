services:
  ml-app:
    build: .
    image: mini-automl-xgboost:latest
    container_name: ml-app
    ports:
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./outputs:/app/outputs
      - ./data:/app/data
    command: uvicorn server:app --app-dir src --host 0.0.0.0 --port 8501
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
