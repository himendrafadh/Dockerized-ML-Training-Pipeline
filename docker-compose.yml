services:
  ml-app:
    build: .
    image: mini-automl-xgboost:latest
    container_name: ml-app
    ports:
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
    volumes:
      - ./outputs:/app/outputs
      - ./data:/app/data
    command: streamlit run src/app.py --server.port=8501 --server.address=0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
